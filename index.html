<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function numberToWords(num) {
      if (num === 0 || num == null) return "Zero Rupees Only";
      const a = ['', 'One ', 'Two ', 'Three ', 'Four ', 'Five ', 'Six ', 'Seven ', 'Eight ', 'Nine ', 'Ten ', 'Eleven ', 'Twelve ', 'Thirteen ', 'Fourteen ', 'Fifteen ', 'Sixteen ', 'Seventeen ', 'Eighteen ', 'Nineteen '];
      const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
      function inWords(n) {
        if ((n = n.toString()).length > 9) return 'overflow';
        let n_array = ('000000000' + n).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
        if (!n_array) return '';
        let str = '';
        str += (n_array[1] != 0) ? (a[Number(n_array[1])] || b[n_array[1][0]] + ' ' + a[n_array[1][1]]) + 'Crore ' : '';
        str += (n_array[2] != 0) ? (a[Number(n_array[2])] || b[n_array[2][0]] + ' ' + a[n_array[2][1]]) + 'Lakh ' : '';
        str += (n_array[3] != 0) ? (a[Number(n_array[3])] || b[n_array[3][0]] + ' ' + a[n_array[3][1]]) + 'Thousand ' : '';
        str += (n_array[4] != 0) ? (a[Number(n_array[4])] || b[n_array[4][0]] + ' ' + a[n_array[4][1]]) + 'Hundred ' : '';
        str += (n_array[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n_array[5])] || b[n_array[5][0]] + ' ' + a[n_array[5][1]]) : '';
        return str;
      }
      // Handle decimal/paise values
      const numStr = Number(num).toFixed(2);
      const [wholeStr, decimalStr] = numStr.split('.');
      const whole = parseInt(wholeStr, 10) || 0;
      const paise = parseInt(decimalStr, 10) || 0;
      
      let result = '';
      if (whole > 0) {
        result = inWords(whole).trim() + ' Rupees';
      } else {
        result = 'Zero Rupees';
      }
      
      // Append paise if present
      if (paise > 0) {
        result += ' and ' + inWords(paise).trim() + ' Paise';
      }
      
      return result + ' Only';
    }

    // Compress/resize uploaded images to avoid exceeding localStorage ~5MB quota
    function compressImage(dataUrl, maxWidth = 300, quality = 0.7) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = Math.min(1, maxWidth / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    // Safe localStorage writer that won't crash the app on QuotaExceededError
    function safeSetItem(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        console.warn(`Failed to save "${key}" to localStorage:`, e);
      }
    }

    const initialTemplates = [
      {
        id: 'house-1',
        name: 'Residential House (Main Street)',
        ownerId: 1,
        units: [
          { floor: '1st Floor', unit: 'Unit 101', tenantName: 'Rahul Sharma', tenantPhone: '+91 9876543210', rent: 15000, water: 500, tax: 0, prevBalance: 0 },
          { floor: '1st Floor', unit: 'Unit 102', tenantName: 'Priya Verma', tenantPhone: '+91 9876543211', rent: 16000, water: 500, tax: 0, prevBalance: 1200 },
          { floor: '2nd Floor', unit: 'Unit 201', tenantName: 'Amit Patel', tenantPhone: '+91 9876543212', rent: 18000, water: 600, tax: 0, prevBalance: 0 },
        ],
        sealUrl: ''
      },
      {
        id: 'godown-1',
        name: 'Godown 1 (Industrial Estate)',
        ownerId: 1,
        units: [
          { floor: 'Ground Floor', unit: 'Bay A', tenantName: 'Logistics Corp Pvt Ltd', tenantPhone: '+91 9876543213', rent: 45000, water: 1200, tax: 2250, prevBalance: 0 },
          { floor: 'Ground Floor', unit: 'Bay B', tenantName: 'Metro Hardware Suppliers', tenantPhone: '+91 9876543214', rent: 50000, water: 1500, tax: 2500, prevBalance: 5000 },
        ],
        sealUrl: ''
      },
      {
        id: 'godown-2',
        name: 'Godown 2 (Commercial Complex)',
        ownerId: 1,
        units: [
          { floor: 'Ground Floor', unit: 'Shop 01', tenantName: 'Apex Electronics', tenantPhone: '+91 9876543215', rent: 30000, water: 800, tax: 1500, prevBalance: 0 }
        ],
        sealUrl: ''
      }
    ];

    const initialManagers = [
      { id: 1, name: 'Afsar Hussain (Owner)', address: '123 Park Avenue, Guwahati', phone: '+91 9876543210' },
      { id: 2, name: 'Ramesh Kumar (Manager)', address: '45 Lake View Road, Guwahati', phone: '+91 9123456789' }
    ];

    const initialOwners = [
      { id: 1, name: 'Afsar Hussain', address: '123 Park Avenue, Guwahati', phone: '+91 9876543210' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('controls');
      const [receiptStep, setReceiptStep] = useState(1);
      const [templates, setTemplates] = useState(() => {
        const saved = localStorage.getItem('rent_templates');
        return saved ? JSON.parse(saved) : initialTemplates;
      });
      const [savedReceipts, setSavedReceipts] = useState(() => {
        const saved = localStorage.getItem('rent_receipts_history');
        return saved ? JSON.parse(saved) : [];
      });

      const [managers, setManagers] = useState(() => {
        const saved = localStorage.getItem('rent_managers');
        return saved ? JSON.parse(saved) : initialManagers;
      });

      const [owners, setOwners] = useState(() => {
        const saved = localStorage.getItem('rent_owners');
        return saved ? JSON.parse(saved) : initialOwners;
      });

      const [selectedTemplateId, setSelectedTemplateId] = useState(() => {
        const saved = localStorage.getItem('rent_current_template');
        return saved || (templates[0]?.id || '');
      });
      const [receiptNo, setReceiptNo] = useState(() => {
        const saved = localStorage.getItem('rent_receipt_no');
        return saved || '0001';
      });
      const [receiptDate, setReceiptDate] = useState(() => {
        const saved = localStorage.getItem('rent_receipt_date');
        return saved || new Date().toISOString().split('T')[0];
      });
      
      const currentTemplate = templates.find(t => t.id === selectedTemplateId) || templates[0];
      const templateOwner = owners.find(o => o.id === currentTemplate?.ownerId) || owners[0];
      
      const [selectedFloor, setSelectedFloor] = useState(() => {
        const saved = localStorage.getItem('rent_selected_floor');
        return saved || '';
      });
      const [selectedUnit, setSelectedUnit] = useState(() => {
        const saved = localStorage.getItem('rent_selected_unit');
        return saved || '';
      });
      const [tenantName, setTenantName] = useState(() => {
        const saved = localStorage.getItem('rent_tenant_name');
        return saved || '';
      });
      const [tenantPhone, setTenantPhone] = useState(() => {
        const saved = localStorage.getItem('rent_tenant_phone');
        return saved || '';
      });
      
      const today = new Date();
      const firstDayStr = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
      const lastDayStr = new Date(today.getFullYear(), today.getMonth() + 1, 0).toISOString().split('T')[0];
      
      const [periodStart, setPeriodStart] = useState(() => {
        const saved = localStorage.getItem('rent_period_start');
        return saved || firstDayStr;
      });
      const [periodEnd, setPeriodEnd] = useState(() => {
        const saved = localStorage.getItem('rent_period_end');
        return saved || lastDayStr;
      });
      const [paymentMode, setPaymentMode] = useState(() => {
        const saved = localStorage.getItem('rent_payment_mode');
        return saved || 'Cash';
      });
      
      const [rentMaint, setRentMaint] = useState(() => {
        const saved = localStorage.getItem('rent_rent_maint');
        return saved ? Number(saved) : 0;
      });
      const [waterCharges, setWaterCharges] = useState(() => {
        const saved = localStorage.getItem('rent_water_charges');
        return saved ? Number(saved) : 0;
      });
      const [rentalTax, setRentalTax] = useState(() => {
        const saved = localStorage.getItem('rent_rental_tax');
        return saved ? Number(saved) : 0;
      });
      
      const [prevUnit, setPrevUnit] = useState(() => {
        const saved = localStorage.getItem('rent_prev_unit');
        return saved ? Number(saved) : 0;
      });
      const [currUnit, setCurrUnit] = useState(() => {
        const saved = localStorage.getItem('rent_curr_unit');
        return saved ? Number(saved) : 0;
      });
      const [elecRate, setElecRate] = useState(() => {
        const saved = localStorage.getItem('rent_elec_rate');
        return saved ? Number(saved) : 10;
      });
      
      const [balanceDue, setBalanceDue] = useState(() => {
        const saved = localStorage.getItem('rent_balance_due');
        return saved ? Number(saved) : 0;
      });
      const [amountReceived, setAmountReceived] = useState(() => {
        const saved = localStorage.getItem('rent_amount_received');
        return saved ? Number(saved) : 0;
      });

      const [selectedReceivedById, setSelectedReceivedById] = useState(() => {
        const saved = localStorage.getItem('rent_received_by_id');
        return saved ? Number(saved) : (initialManagers[0]?.id || 1);
      });

      const [showManagerForm, setShowManagerForm] = useState(false);
      const [editingManagerId, setEditingManagerId] = useState(null);
      const [managerName, setManagerName] = useState('');
      const [managerAddress, setManagerAddress] = useState('');
      const [managerPhone, setManagerPhone] = useState('');

      const [showOwnerForm, setShowOwnerForm] = useState(false);
      const [editingOwnerId, setEditingOwnerId] = useState(null);
      const [ownerName, setOwnerName] = useState('');
      const [ownerAddress, setOwnerAddress] = useState('');
      const [ownerPhone, setOwnerPhone] = useState('');

      const [lookupReceiptNo, setLookupReceiptNo] = useState('');
      const [showAddPropertyForm, setShowAddPropertyForm] = useState(false);
      const [newPropertyName, setNewPropertyName] = useState('');
      // Pagination state for saved receipts table
      const [receiptsPage, setReceiptsPage] = useState(1);
      const RECEIPTS_PER_PAGE = 10;

      const receiptRef = useRef();
      // Flag to prevent the template-change effect from resetting form values during a lookup
      const isLookupRef = useRef(false);

      // Validate required Step-1 fields before navigating to Step-2 (Generation)
      const goToGenerationTab = () => {
        if (receiptStep === 1) {
          if (!selectedUnit) {
            alert('Please select a Floor & Unit before proceeding.');
            return;
          }
          if (!tenantName.trim()) {
            alert('Please enter a Tenant Name before proceeding.');
            return;
          }
        }
        setActiveTab('generation');
        setReceiptStep(2);
      };

      useEffect(() => { safeSetItem('rent_current_template', selectedTemplateId); }, [selectedTemplateId]);
      useEffect(() => { safeSetItem('rent_receipt_no', receiptNo); }, [receiptNo]);
      useEffect(() => { safeSetItem('rent_receipt_date', receiptDate); }, [receiptDate]);
      useEffect(() => { safeSetItem('rent_selected_floor', selectedFloor); }, [selectedFloor]);
      useEffect(() => { safeSetItem('rent_selected_unit', selectedUnit); }, [selectedUnit]);
      useEffect(() => { safeSetItem('rent_tenant_name', tenantName); }, [tenantName]);
      useEffect(() => { safeSetItem('rent_tenant_phone', tenantPhone); }, [tenantPhone]);
      useEffect(() => { safeSetItem('rent_period_start', periodStart); }, [periodStart]);
      useEffect(() => { safeSetItem('rent_period_end', periodEnd); }, [periodEnd]);
      useEffect(() => { safeSetItem('rent_payment_mode', paymentMode); }, [paymentMode]);
      useEffect(() => { safeSetItem('rent_rent_maint', rentMaint.toString()); }, [rentMaint]);
      useEffect(() => { safeSetItem('rent_water_charges', waterCharges.toString()); }, [waterCharges]);
      useEffect(() => { safeSetItem('rent_rental_tax', rentalTax.toString()); }, [rentalTax]);
      useEffect(() => { safeSetItem('rent_prev_unit', prevUnit.toString()); }, [prevUnit]);
      useEffect(() => { safeSetItem('rent_curr_unit', currUnit.toString()); }, [currUnit]);
      useEffect(() => { safeSetItem('rent_elec_rate', elecRate.toString()); }, [elecRate]);
      useEffect(() => { safeSetItem('rent_balance_due', balanceDue.toString()); }, [balanceDue]);
      useEffect(() => { safeSetItem('rent_amount_received', amountReceived.toString()); }, [amountReceived]);
      useEffect(() => { safeSetItem('rent_received_by_id', selectedReceivedById.toString()); }, [selectedReceivedById]);

      useEffect(() => { safeSetItem('rent_templates', JSON.stringify(templates)); }, [templates]);
      useEffect(() => { safeSetItem('rent_receipts_history', JSON.stringify(savedReceipts)); }, [savedReceipts]);
      useEffect(() => { safeSetItem('rent_managers', JSON.stringify(managers)); }, [managers]);
      useEffect(() => { safeSetItem('rent_owners', JSON.stringify(owners)); }, [owners]);

      useEffect(() => {
        if (savedReceipts.length > 0) {
          const lastNo = Math.max(...savedReceipts.map(r => parseInt(r.receiptNo, 10) || 0));
          setReceiptNo(String(lastNo + 1).padStart(4, '0'));
        } else {
          setReceiptNo('0001');
        }
        // Reset pagination if current page is now out of range
        const totalPages = Math.max(1, Math.ceil(savedReceipts.length / RECEIPTS_PER_PAGE));
        if (receiptsPage > totalPages) {
          setReceiptsPage(totalPages);
        }
      }, [savedReceipts]);

      useEffect(() => {
        // Skip resetting form values when template changed due to a receipt lookup
        if (isLookupRef.current) {
          isLookupRef.current = false;
          return;
        }
        if (currentTemplate && currentTemplate.units.length > 0) {
          const firstUnit = currentTemplate.units[0];
          setSelectedFloor(firstUnit.floor);
          setSelectedUnit(firstUnit.unit);
          setTenantName(firstUnit.tenantName);
          setTenantPhone(firstUnit.tenantPhone || '');
          setRentMaint(firstUnit.rent);
          setWaterCharges(firstUnit.water);
          setRentalTax(firstUnit.tax);
          setBalanceDue(firstUnit.prevBalance);
        }
      }, [selectedTemplateId]);

      const fetchPreviousBillData = (floor, unit, tenantName, defaultPrevBalance) => {
        // Auto-fetch previous unit and balance from last receipt for this unit
        // Match by property name too, to prevent cross-property history leakage
        const lastReceiptForUnit = savedReceipts.find(r => 
          r.propertyName === currentTemplate.name &&
          r.floor === floor && 
          r.unit === unit &&
          r.tenantName === tenantName
        );
        
        if (lastReceiptForUnit) {
          // Previous unit = current unit from last receipt
          setPrevUnit(lastReceiptForUnit.elecDetails.currUnit);
          // Previous balance due = the pending amount from last receipt (dueAmount)
          // This is the amount that was not paid in the previous receipt
          const previousPendingBalance = lastReceiptForUnit.dueAmount > 0 ? lastReceiptForUnit.dueAmount : 0;
          setBalanceDue(previousPendingBalance);
        } else {
          // No previous receipt, use template default
          setPrevUnit(0);
          setBalanceDue(defaultPrevBalance);
        }
      };

      const handleUnitChange = (unitObj) => {
        setSelectedFloor(unitObj.floor);
        setSelectedUnit(unitObj.unit);
        setTenantName(unitObj.tenantName);
        setTenantPhone(unitObj.tenantPhone || '');
        setRentMaint(unitObj.rent);
        setWaterCharges(unitObj.water);
        setRentalTax(unitObj.tax);
        
        // Auto-fetch previous unit and balance from last receipt for this unit
        fetchPreviousBillData(unitObj.floor, unitObj.unit, unitObj.tenantName, unitObj.prevBalance);
      };

      const handleLookupReceipt = () => {
        // Normalize receipt number so "5" matches "0005"
        const found = savedReceipts.find(r => parseInt(r.receiptNo, 10) === parseInt(lookupReceiptNo, 10));
        if (found) {
          // Find the template ID by matching the property name
          const matchedTemplate = templates.find(t => t.name === found.propertyName);
          if (matchedTemplate && matchedTemplate.id !== selectedTemplateId) {
            // Set flag so the template-change effect doesn't reset the looked-up values
            isLookupRef.current = true;
            setSelectedTemplateId(matchedTemplate.id);
          }
          
          setReceiptNo(found.receiptNo);
          setReceiptDate(found.date);
          setTenantName(found.tenantName);
          setTenantPhone(found.tenantPhone || '');
          setSelectedFloor(found.floor);
          setSelectedUnit(found.unit);
          
          // Use the found receipt's meter reading directly as the new previous reading.
          // Avoids calling fetchPreviousBillData here, which would reference the stale
          // currentTemplate during a cross-property lookup.
          setPrevUnit(found.elecDetails.currUnit);
          const previousPendingBalance = found.dueAmount > 0 ? found.dueAmount : 0;
          setBalanceDue(previousPendingBalance);
          
          setPeriodStart(found.periodStart);
          setPeriodEnd(found.periodEnd);
          setPaymentMode(found.paymentMode);
          setRentMaint(found.rentMaint);
          setWaterCharges(found.waterCharges);
          setRentalTax(found.rentalTax);
          
          // Keep current unit as 0, user will enter new reading
          setCurrUnit(0);
          
          setElecRate(found.elecDetails.elecRate);
          
          setAmountReceived(0); // Reset for new payment
          alert('Receipt details loaded! You can now edit and save changes.');
        } else {
          alert('Receipt not found!');
        }
      };

      const handleAddProperty = () => {
        if (!newPropertyName.trim()) {
          alert('Please enter property name');
          return;
        }
        const newProperty = {
          id: 'property-' + Date.now(),
          name: newPropertyName,
          ownerId: 1,
          units: [],
          sealUrl: ''
        };
        setTemplates([...templates, newProperty]);
        setNewPropertyName('');
        setShowAddPropertyForm(false);
        alert('Property added successfully!');
      };

      const elecUnitsConsumed = Math.max(0, currUnit - prevUnit);
      const elecTotalAmount = elecUnitsConsumed * elecRate;
      const totalBalanceCurrentMonth = rentMaint + waterCharges + rentalTax + elecTotalAmount;
      const totalAmountToBeReceived = totalBalanceCurrentMonth + balanceDue;
      const dueAmount = totalAmountToBeReceived - amountReceived;
      const isFullPaid = dueAmount <= 0 && totalAmountToBeReceived > 0;

      const activeReceivedBy = managers.find(m => m.id === selectedReceivedById) || managers[0] || { name: '', address: '', phone: '' };

      const handleAddManager = () => {
        if (!managerName.trim()) { alert('Please enter manager name'); return; }
        const newManager = { id: Date.now(), name: managerName, address: managerAddress, phone: managerPhone };
        setManagers([...managers, newManager]);
        resetManagerForm();
        alert('Manager added successfully!');
      };

      const handleUpdateManager = () => {
        if (!managerName.trim()) { alert('Please enter manager name'); return; }
        const updated = managers.map(m => m.id === editingManagerId ? { ...m, name: managerName, address: managerAddress, phone: managerPhone } : m);
        setManagers(updated);
        resetManagerForm();
        alert('Manager updated successfully!');
      };

      const handleDeleteManager = (id) => {
        if (confirm('Are you sure you want to delete this manager?')) {
          setManagers(managers.filter(m => m.id !== id));
          if (selectedReceivedById === id) {
            const remaining = managers.filter(m => m.id !== id);
            setSelectedReceivedById(remaining[0]?.id || initialManagers[0]?.id);
          }
        }
      };

      const handleEditManager = (manager) => {
        setEditingManagerId(manager.id);
        setManagerName(manager.name);
        setManagerAddress(manager.address);
        setManagerPhone(manager.phone);
        setShowManagerForm(true);
      };

      const resetManagerForm = () => {
        setShowManagerForm(false);
        setEditingManagerId(null);
        setManagerName('');
        setManagerAddress('');
        setManagerPhone('');
      };

      const handleAddOwner = () => {
        if (!ownerName.trim()) { alert('Please enter owner name'); return; }
        const newOwner = { id: Date.now(), name: ownerName, address: ownerAddress, phone: ownerPhone };
        setOwners([...owners, newOwner]);
        resetOwnerForm();
        alert('Owner added successfully!');
      };

      const handleUpdateOwner = () => {
        if (!ownerName.trim()) { alert('Please enter owner name'); return; }
        const updated = owners.map(o => o.id === editingOwnerId ? { ...o, name: ownerName, address: ownerAddress, phone: ownerPhone } : o);
        setOwners(updated);
        resetOwnerForm();
        alert('Owner updated successfully!');
      };

      const handleDeleteOwner = (id) => {
        if (confirm('Are you sure you want to delete this owner?')) {
          setOwners(owners.filter(o => o.id !== id));
        }
      };

      const handleEditOwner = (owner) => {
        setEditingOwnerId(owner.id);
        setOwnerName(owner.name);
        setOwnerAddress(owner.address);
        setOwnerPhone(owner.phone);
        setShowOwnerForm(true);
      };

      const resetOwnerForm = () => {
        setShowOwnerForm(false);
        setEditingOwnerId(null);
        setOwnerName('');
        setOwnerAddress('');
        setOwnerPhone('');
      };

      const handleDownloadPDF = async () => {
        const element = receiptRef.current;
        if (!element) return;

        // Save original inline styles to restore after capture
        const originalWidth = element.style.width;
        const originalMaxWidth = element.style.maxWidth;
        const originalMinHeight = element.style.minHeight;
        const originalPadding = element.style.padding;
        const originalMargin = element.style.margin;

        // Apply fixed A4 layout styles directly to element for crisp rendering
        element.style.width = '750px';
        element.style.maxWidth = '750px';
        element.style.minHeight = 'auto';
        element.style.padding = '24px';
        element.style.margin = '0 auto';

        // Ensure Base64 seal/signature images are fully loaded
        const images = element.getElementsByTagName('img');
        const imagePromises = Array.from(images).map(img => {
          if (img.complete) return Promise.resolve();
          return new Promise(resolve => {
            img.onload = resolve;
            img.onerror = resolve;
          });
        });

        await Promise.all(imagePromises);

        const opt = {
          margin:       [0.2, 0.2, 0.2, 0.2],
          filename:     `Rent_Receipt_${receiptNo}_${tenantName.replace(/\s+/g, '_')}.pdf`,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { 
            scale: 2, 
            useCORS: true, 
            scrollY: 0,
            scrollX: 0
          },
          jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' },
          pagebreak:    { mode: 'avoid-all' }
        };

        try {
          await html2pdf().set(opt).from(element).save();
        } catch (err) {
          console.error('PDF Export Error:', err);
        } finally {
          // Always restore original inline styling
          element.style.width = originalWidth;
          element.style.maxWidth = originalMaxWidth;
          element.style.minHeight = originalMinHeight;
          element.style.padding = originalPadding;
          element.style.margin = originalMargin;
        }
      };

      const handleSaveReceipt = () => {
        const newRecord = {
          id: Date.now(), receiptNo, date: receiptDate, propertyName: currentTemplate.name, ownerName: templateOwner.name,
          floor: selectedFloor, unit: selectedUnit, tenantName, tenantPhone, periodStart, periodEnd, paymentMode,
          rentMaint, waterCharges, rentalTax, elecDetails: { prevUnit, currUnit, elecRate, elecTotalAmount },
          totalAmountToBeReceived, amountReceived, dueAmount, isFullPaid, receivedBy: activeReceivedBy.name
        };
        setSavedReceipts([newRecord, ...savedReceipts]);
        alert(`Receipt #${receiptNo} saved successfully!`);
        
        // Clear form entries for next receipt
        clearForm();
      };

      const clearForm = () => {
        // Reset financial fields
        setRentMaint(0);
        setWaterCharges(0);
        setRentalTax(0);

                                  <td className="p-1.5"><input type="text" value={u.tenantName} onChange={e => { const updated = [...templates]; updated[index].units[uIdx].tenantName = e.target.value; setTemplates(updated); }} className="w-full border p-1 rounded" /></td>
                                  <td className="p-1.5"><input type="text" value={u.tenantPhone} onChange={e => { const updated = [...templates]; updated[index].units[uIdx].tenantPhone = e.target.value; setTemplates(updated); }} className="w-full border p-1 rounded" /></td>
                                  <td className="p-1.5"><input type="number" value={u.rent} onChange={e => { const updated = [...templates]; updated[index].units[uIdx].rent = Number(e.target.value); setTemplates(updated); }} className="w-full border p-1 rounded text-right" /></td>
                                  <td className="p-1.5"><input type="number" value={u.water} onChange={e => { const updated = [...templates]; updated[index].units[uIdx].water = Number(e.target.value); setTemplates(updated); }} className="w-full border p-1 rounded text-right" /></td>
                                  <td className="p-1.5"><input type="number" value={u.tax} onChange={e => { const updated = [...templates]; updated[index].units[uIdx].tax = Number(e.target.value); setTemplates(updated); }} className="w-full border p-1 rounded text-right" /></td>
                                  <td className="p-1.5"><input type="number" value={u.prevBalance} onChange={e => { const updated = [...templates]; updated[index].units[uIdx].prevBalance = Number(e.target.value); setTemplates(updated); }} className="w-full border p-1 rounded text-right text-red-600" /></td>
                                  <td className="p-1.5 text-center">
                                    <button onClick={() => { const updated = [...templates]; updated[index].units.splice(uIdx, 1); setTemplates(updated); }} className="text-red-600 hover:text-red-800 font-bold text-xs">✕</button>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                        <button onClick={() => { const updated = [...templates]; updated[index].units.push({ floor: '1st Floor', unit: 'Unit NEW', tenantName: 'New Tenant', tenantPhone: '', rent: 10000, water: 500, tax: 0, prevBalance: 0 }); setTemplates(updated); }} className="mt-2 text-xs bg-indigo-50 text-indigo-600 font-semibold px-3 py-1.5 rounded hover:bg-indigo-100">+ Add Unit Row</button>
                      </div>

                      <div className="border-t pt-3">
                        <label className="block text-xs font-semibold text-gray-600 uppercase mb-1">Seal / Signature Image Upload</label>
                        <div className="flex items-center gap-4">
                          <input type="file" accept="image/*" onChange={(e) => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onloadend = async () => { const compressed = await compressImage(reader.result); const updated = [...templates]; updated[index].sealUrl = compressed; setTemplates(updated); }; reader.readAsDataURL(file); } }} className="text-xs" />
                          {tpl.sealUrl && <img src={tpl.sealUrl} alt="Seal Preview" className="h-10 border p-1 rounded bg-white" />}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2"><span>👤</span> Owners Management</h2>
                  <button onClick={() => setShowOwnerForm(true)} className="text-xs bg-indigo-50 text-indigo-600 font-semibold px-3 py-1.5 rounded hover:bg-indigo-100">+ Add Owner</button>
                </div>

                {showOwnerForm && (
                  <div className="border rounded-lg p-4 bg-gray-50 mb-4">
                    <h3 className="text-sm font-semibold text-gray-700 mb-3">{editingOwnerId ? 'Edit Owner' : 'Add New Owner'}</h3>
                    <div className="space-y-3">
                      <div>
                        <label className="block text-xs font-semibold text-gray-600 uppercase mb-1">Name</label>
                        <input type="text" value={ownerName} onChange={(e) => setOwnerName(e.target.value)} className="w-full border p-2 rounded text-sm" placeholder="Enter owner name" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-gray-600 uppercase mb-1">Address</label>
                        <input type="text" value={ownerAddress} onChange={(e) => setOwnerAddress(e.target.value)} className="w-full border p-2 rounded text-sm" placeholder="Enter address" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-gray-600 uppercase mb-1">Phone</label>
                        <input type="text" value={ownerPhone} onChange={(e) => setOwnerPhone(e.target.value)} className="w-full border p-2 rounded text-sm" placeholder="Enter phone number" />
                      </div>
                      <div className="flex gap-2">
                        <button onClick={editingOwnerId ? handleUpdateOwner : handleAddOwner} className="flex-1 bg-indigo-600 text-white font-medium py-2 rounded-lg hover:bg-indigo-700 transition text-sm">{editingOwnerId ? 'Update' : 'Add'} Owner</button>
                        <button onClick={resetOwnerForm} className="px-4 bg-gray-200 text-gray-700 font-medium py-2 rounded-lg hover:bg-gray-300 transition text-sm">Cancel</button>
                      </div>
                    </div>
                  </div>
                )}

                <div className="space-y-2">
                  {owners.map((owner) => (
                    <div key={owner.id} className="border rounded-lg p-3 bg-white flex items-center justify-between">
                      <div>
                        <div className="text-sm font-semibold text-gray-800">{owner.name}</div>
                        <div className="text-xs text-gray-500">{owner.address}</div>
                        <div className="text-xs text-gray-500">Ph: {owner.phone}</div>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => handleEditOwner(owner)} className="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded hover:bg-blue-100">Edit</button>
                        <button onClick={() => handleDeleteOwner(owner.id)} className="text-xs bg-red-50 text-red-600 px-2 py-1 rounded hover:bg-red-100">Delete</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2"><span>👥</span> Managers & Receivers</h2>
                  <button onClick={() => setShowManagerForm(true)} className="text-xs bg-indigo-50 text-indigo-600 font-semibold px-3 py-1.5 rounded hover:bg-indigo-100">+ Add Manager</button>
                </div>

                {showManagerForm && (
                  <div className="border rounded-lg p-4 bg-gray-50 mb-4">
                    <h3 className="text-sm font-semibold text-gray-700 mb-3">{editingManagerId ? 'Edit Manager' : 'Add New Manager'}</h3>
                    <div className="space-y-3">
                      <div>
                        <label className="block text-xs font-semibold text-gray-600 uppercase mb-1">Name</label>
                        <input type="text" value={managerName} onChange={(e) => setManagerName(e.target.value)} className="w-full border p-2 rounded text-sm" placeholder="Enter name" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-gray-600 uppercase mb-1">Address</label>
                        <input type="text" value={managerAddress} onChange={(e) => setManagerAddress(e.target.value)} className="w-full border p-2 rounded text-sm" placeholder="Enter address" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-gray-600 uppercase mb-1">Phone</label>
                        <input type="text" value={managerPhone} onChange={(e) => setManagerPhone(e.target.value)} className="w-full border p-2 rounded text-sm" placeholder="Enter phone number" />
                      </div>
                      <div className="flex gap-2">
                        <button onClick={editingManagerId ? handleUpdateManager : handleAddManager} className="flex-1 bg-indigo-600 text-white font-medium py-2 rounded-lg hover:bg-indigo-700 transition text-sm">{editingManagerId ? 'Update' : 'Add'} Manager</button>
                        <button onClick={resetManagerForm} className="px-4 bg-gray-200 text-gray-700 font-medium py-2 rounded-lg hover:bg-gray-300 transition text-sm">Cancel</button>
                      </div>
                    </div>
                  </div>
                )}

                <div className="space-y-2">
                  {managers.map((manager) => (
                    <div key={manager.id} className="border rounded-lg p-3 bg-white flex items-center justify-between">
                      <div>
                        <div className="text-sm font-semibold text-gray-800">{manager.name}</div>
                        <div className="text-xs text-gray-500">{manager.address}</div>
                        <div className="text-xs text-gray-500">Ph: {manager.phone}</div>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => handleEditManager(manager)} className="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded hover:bg-blue-100">Edit</button>
                        <button onClick={() => handleDeleteManager(manager.id)} className="text-xs bg-red-50 text-red-600 px-2 py-1 rounded hover:bg-red-100">Delete</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2"><span>📜</span> Saved Receipts History ({savedReceipts.length})</h2>
                  {savedReceipts.length > 0 && (
                    <button onClick={() => { if (confirm('Are you sure you want to clear all history?')) setSavedReceipts([]); }} className="text-xs text-red-600 hover:underline">Clear Log</button>
                  )}
                </div>

                {savedReceipts.length === 0 ? (
                  <p className="text-sm text-gray-500 italic">No receipts generated yet.</p>
                ) : (
                  <div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-xs text-left border rounded">
                        <thead className="bg-gray-100 border-b">
                          <tr>
                            <th className="p-2">Receipt #</th>
                            <th className="p-2">Date</th>
                            <th className="p-2">Property</th>
                            <th className="p-2">Tenant Name</th>
                            <th className="p-2 text-right">Total (₹)</th>
                            <th className="p-2 text-right">Received (₹)</th>
                            <th className="p-2 text-center">Status</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y">
                          {savedReceipts
                            .slice((receiptsPage - 1) * RECEIPTS_PER_PAGE, receiptsPage * RECEIPTS_PER_PAGE)
                            .map((r) => (
                              <tr key={r.id} className="hover:bg-gray-50">
                                <td className="p-2 font-mono font-bold text-indigo-600">{r.receiptNo}</td>
                                <td className="p-2">{r.date}</td>
                                <td className="p-2">{r.propertyName} ({r.unit})</td>
                                <td className="p-2 font-medium">{r.tenantName}</td>
                                <td className="p-2 text-right font-mono">₹{r.totalAmountToBeReceived.toFixed(2)}</td>
                                <td className="p-2 text-right font-mono text-green-700 font-bold">₹{r.amountReceived.toFixed(2)}</td>
                                <td className="p-2 text-center">
                                  {r.isFullPaid ? <span className="bg-green-100 text-green-800 px-2 py-0.5 rounded text-[10px] font-bold">FULL PAID</span> : <span className="bg-red-100 text-red-800 px-2 py-0.5 rounded text-[10px] font-bold">DUE: ₹{r.dueAmount.toFixed(2)}</span>}
                                </td>
                              </tr>
                            ))}
                        </tbody>
                      </table>
                    </div>
                    {savedReceipts.length > RECEIPTS_PER_PAGE && (
                      <div className="flex items-center justify-between mt-3">
                        <span className="text-xs text-gray-500">
                          Page {receiptsPage} of {Math.ceil(savedReceipts.length / RECEIPTS_PER_PAGE)}
                        </span>
                        <div className="flex gap-2">
                          <button
                            onClick={() => setReceiptsPage(Math.max(1, receiptsPage - 1))}
                            disabled={receiptsPage === 1}
                            className="text-xs bg-gray-100 text-gray-700 px-3 py-1.5 rounded hover:bg-gray-200 disabled:opacity-40 disabled:cursor-not-allowed"
                          >
                            ← Prev
                          </button>
                          <button
                            onClick={() => setReceiptsPage(Math.min(Math.ceil(savedReceipts.length / RECEIPTS_PER_PAGE), receiptsPage + 1))}
                            disabled={receiptsPage >= Math.ceil(savedReceipts.length / RECEIPTS_PER_PAGE)}
                            className="text-xs bg-gray-100 text-gray-700 px-3 py-1.5 rounded hover:bg-gray-200 disabled:opacity-40 disabled:cursor-not-allowed"
                          >
                            Next →
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
